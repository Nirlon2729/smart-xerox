name: Render Keep-Alive Monitor

on:
  schedule:
    # Runs on the repository's default branch (main) approximately every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-xerox-render-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive-health-check:
    name: Smart Xerox Backend Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Production /api/health Endpoint
        run: |
          node -e '
            const fs = require("fs");
            const HEALTH_URL = "https://smart-xerox-api.onrender.com/api/health";
            const TIMEOUT_MS = 35000;
            const MAX_ATTEMPTS = 2; // 1 initial attempt + 1 retry for temporary failures
            const RETRY_DELAY_MS = 5000;

            async function probeOnce() {
              const started = Date.now();
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
              try {
                const res = await fetch(HEALTH_URL, {
                  method: "GET",
                  headers: {
                    Accept: "application/json",
                    "User-Agent": "SmartXerox-GitHubActions-KeepAlive/1.0"
                  },
                  signal: controller.signal
                });
                const elapsedMs = Date.now() - started;
                const text = await res.text();
                let json = null;
                try {
                  json = JSON.parse(text);
                } catch {}

                const jsonHealthy =
                  Boolean(json) &&
                  json.success === true &&
                  (!json.status || json.status === "ok") &&
                  (!json.database || json.database === "connected");

                return {
                  healthy: res.status === 200 && jsonHealthy,
                  httpStatus: res.status,
                  responseTimeMs: elapsedMs,
                  serviceStatus: json?.status || (json?.success ? "ok" : "unhealthy"),
                  database: json?.database || "not-reported",
                  error: null
                };
              } catch (err) {
                return {
                  healthy: false,
                  httpStatus: 0,
                  responseTimeMs: Date.now() - started,
                  serviceStatus: "unreachable",
                  database: "unknown",
                  error: err.name === "AbortError" ? `Request timed out after ${TIMEOUT_MS}ms` : err.message
                };
              } finally {
                clearTimeout(timer);
              }
            }

            (async () => {
              let result = null;
              let attemptsUsed = 0;

              for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                attemptsUsed = attempt;
                result = await probeOnce();
                console.log(JSON.stringify({
                  timestamp: new Date().toISOString(),
                  url: HEALTH_URL,
                  attempt,
                  httpStatus: result.httpStatus,
                  responseTimeMs: result.responseTimeMs,
                  healthy: result.healthy,
                  healthStatus: result.serviceStatus,
                  database: result.database,
                  error: result.error
                }));

                if (result.healthy) break;
                if (attempt < MAX_ATTEMPTS) {
                  await new Promise((r) => setTimeout(r, RETRY_DELAY_MS));
                }
              }

              const summaryPath = process.env.GITHUB_STEP_SUMMARY;
              if (summaryPath) {
                const lines = [
                  "### Smart Xerox Render Keep-Alive Health Check",
                  "",
                  "| Field | Value |",
                  "|---|---|",
                  `| **Endpoint** | \`${HEALTH_URL}\` |`,
                  `| **Health Status** | ${result.healthy ? "HEALTHY" : "UNHEALTHY"} (\`${result.serviceStatus}\`) |`,
                  `| **HTTP Status** | \`${result.httpStatus}\` |`,
                  `| **Response Time** | \`${result.responseTimeMs} ms\` |`,
                  `| **Database** | \`${result.database}\` |`,
                  `| **Attempts** | \`${attemptsUsed} / ${MAX_ATTEMPTS}\` |`,
                  result.error ? `| **Error** | \`${result.error}\` |` : ""
                ].filter(Boolean);
                fs.appendFileSync(summaryPath, lines.join("\n") + "\n", "utf-8");
              }

              if (!result.healthy) {
                console.error("Smart Xerox backend health check failed after 1 retry.");
                process.exit(1);
              }
            })();
          '
